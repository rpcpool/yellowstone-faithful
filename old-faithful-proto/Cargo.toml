[package]
name = "old-faithful-proto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.79"
bincode = "1.3.3"
# Keep five8 1.x on its compatible core when legacy SDK crates also resolve five8 0.x.
five8_core = "=1.0.0"
prost = "0.14.4"
serde = "1.0.188"
solana-clock = "3.1.1"
solana-hash = "4.3.0"
solana-message = { version = "4.4.1", features = ["serde", "wincode"] }
solana-storage-proto = { version = "4.2.1", features = ["agave-unstable-api"] }
solana-transaction = { version = "4.1.6", features = ["serde", "wincode"] }
solana-transaction-error = { version = "3.3.1", features = ["serde", "wincode"] }
solana-transaction-status = { version = "4.2.1", features = ["agave-unstable-api"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
wincode = "0.5.5"
[dev-dependencies]
const-hex = "1.12.0"
serde_json = "1.0.108"

[build-dependencies]
anyhow = "1.0.79"
protobuf-src = "1.1.0"
tonic-prost-build = "0.14.6"

[workspace]

[patch.crates-io]
solana-offchain-message = { git = "https://github.com/anza-xyz/solana-sdk.git", rev = "74f57420304c75c6007c596cf5a4b747957a3a60" }
