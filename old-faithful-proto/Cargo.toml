[package]
name = "old-faithful-proto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.79"
bincode = "1.3.3"
prost = "0.14.4"
serde = "1.0.188"
solana-clock = "4.0.0"
solana-hash = "4.7.0"
solana-message = { version = "5.1.0", features = ["serde", "wincode"] }
solana-storage-proto = { version = "~4.4.0", features = ["agave-unstable-api"] }
solana-transaction = { version = "5.1.0", features = ["serde", "wincode"] }
solana-transaction-error = { version = "4.1.0", features = ["serde", "wincode"] }
solana-transaction-status = { version = "~4.4.0", features = ["agave-unstable-api"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
wincode = "0.6.3"
[dev-dependencies]
const-hex = "1.12.0"
serde_json = "1.0.108"

[build-dependencies]
anyhow = "1.0.79"
protobuf-src = "1.1.0"
tonic-prost-build = "0.14.6"

[workspace]
