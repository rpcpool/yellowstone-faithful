concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tests-rust.yml'
      - 'jsonparsed/**'
      - 'old-faithful-proto/**'
      - 'geyser-plugin-runner/**'
      - 'tests/rust/**'
  workflow_dispatch:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/tests-rust.yml'
      - 'jsonparsed/**'
      - 'old-faithful-proto/**'
      - 'geyser-plugin-runner/**'
      - 'tests/rust/**'

env:
  CARGO_TERM_COLOR: always

name: tests_rust
jobs:
  test_rust:
    strategy:
      matrix:
        os: [ubuntu-22.04]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libudev-dev libclang-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}-0000
          restore-keys: |
            ${{ matrix.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}

      - name: Set rust version
        run: |
          echo "WORKSPACE_RUST_VERSION=1.84.0" >> "$GITHUB_ENV"
          echo "PROTO_RUST_VERSION=$(grep -oP 'channel = "\K\d\.\d+\.\d+(?=")' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.84.0
          components: clippy

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.PROTO_RUST_VERSION }}
          components: clippy

      - name: cargo tree
        run: |
          cargo +${{ env.WORKSPACE_RUST_VERSION }} tree
          git checkout Cargo.lock
          cargo +${{ env.WORKSPACE_RUST_VERSION }} tree --frozen --offline

      - name: cargo fmt
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        # Keep the existing workspace on its original toolchain. Rust 1.96
        # promotes new lints in unchanged packages to errors under -Dwarnings.
        run: cargo +${{ env.WORKSPACE_RUST_VERSION }} clippy --workspace --all-targets --tests -- -Dwarnings

      - name: Clippy old-faithful-proto
        working-directory: old-faithful-proto
        run: cargo +${{ env.PROTO_RUST_VERSION }} clippy --all-targets --tests -- -Dwarnings

      - name: Run test
        run: cargo +${{ env.WORKSPACE_RUST_VERSION }} test --all-targets

      - name: Test old-faithful-proto
        working-directory: old-faithful-proto
        run: cargo +${{ env.PROTO_RUST_VERSION }} test
